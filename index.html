<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tune — YouTube Player</title>
<style>
  :root{
    --bg: #000000;
    --bg2: #121214;
    --card: #1c1c1e;
    --card2: #2c2c2e;
    --sep: #313134;
    --text: #f5f5f7;
    --text2: #98989d;
    --text3: #636366;
    --accent: #0a84ff;
    --accent-soft: rgba(10,132,255,0.15);
    --danger: #ff453a;
    --radius: 14px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none;
  }
  /* ---- Custom background photo layer ---- */
  #bgLayer{
    position: fixed; inset:0;
    z-index:0;
    background-size: cover;
    background-position: center;
    filter: blur(2px) brightness(0.55);
    transform: scale(1.05);
    transition: opacity 0.3s ease;
  }
  #bgLayer.empty{
    background: radial-gradient(circle at 30% -10%, #201a2c, #000 60%);
  }
  #app{
    position: relative;
    z-index: 1;
    max-width: 560px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: transparent;
  }

  /* ---- Nav ---- */
  .navbar{
    padding: calc(14px + var(--safe-top)) 18px 12px;
    position: sticky;
    top:0;
    z-index: 20;
    background: rgba(20,20,24,0.55);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border-bottom: 0.5px solid rgba(255,255,255,0.08);
    display:flex;
    align-items:center;
    gap: 10px;
  }
  .navbar-row{
    display:flex;
    align-items:center;
    gap: 10px;
    width:100%;
  }
  .bg-btn{
    flex-shrink:0;
    width: 38px; height:38px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(10px);
    color: var(--text);
    display:flex; align-items:center; justify-content:center;
  }
  .bg-btn svg{ width:18px; height:18px; }
  .search-wrap{
    position: relative;
    display:flex;
    align-items:center;
    flex:1;
  }
  .search-wrap svg.icon-search{
    position:absolute; left:12px;
    width:16px; height:16px;
    color: var(--text2);
    pointer-events:none;
  }
  #searchInput{
    width:100%;
    background: rgba(255,255,255,0.14);
    backdrop-filter: blur(10px);
    border: none;
    border-radius: 10px;
    padding: 9px 36px 9px 34px;
    font-size: 15px;
    color: var(--text);
    outline:none;
  }
  #searchInput::placeholder{ color: var(--text3); }
  .clear-btn{
    position:absolute; right:8px;
    width:20px; height:20px;
    border-radius:50%;
    background: var(--text3);
    color: var(--bg2);
    border:none;
    display:none;
    align-items:center; justify-content:center;
    font-size: 13px;
    cursor:pointer;
  }

  /* ---- Main scroll area ---- */
  .content{
    flex:1;
    overflow-y: auto;
    padding-bottom: calc(96px + var(--safe-bottom));
  }
  .section-title{
    font-size: 13px;
    font-weight: 600;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 20px 18px 8px;
  }
  .empty-state{
    padding: 60px 30px;
    text-align:center;
    color: var(--text3);
  }
  .empty-state svg{ width:44px; height:44px; margin-bottom:14px; opacity:0.5; }
  .empty-state p{ font-size: 14px; line-height:1.5; margin:0; }

  .list{
    margin: 0 12px;
    background: rgba(28,28,30,0.55);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 0.5px solid rgba(255,255,255,0.08);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .row{
    display:flex;
    align-items:center;
    gap: 12px;
    padding: 9px 12px;
    border-bottom: 0.5px solid var(--sep);
    cursor:pointer;
    transition: background 0.1s;
  }
  .row:last-child{ border-bottom:none; }
  .row:active{ background: rgba(255,255,255,0.04); }
  .row .thumb{
    width: 52px; height:52px;
    border-radius: 8px;
    object-fit: cover;
    background: var(--card2);
    flex-shrink:0;
  }
  .row .info{ flex:1; min-width:0; }
  .row .title{
    font-size: 14.5px; font-weight:550;
    color: var(--text);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .row .sub{
    font-size: 12.5px; color: var(--text2);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    margin-top:2px;
  }
  .row.active .title{ color: var(--accent); }
  .row .rowbtn{
    flex-shrink:0;
    width: 30px; height:30px;
    display:flex; align-items:center; justify-content:center;
    color: var(--text2);
    background:none; border:none;
  }
  .row .rowbtn:active{ color: var(--danger); }
  .row .eq{
    width:16px; height:16px; flex-shrink:0;
    display:flex; align-items:flex-end; gap:2px;
  }
  .row .eq span{
    width:3px; background: var(--accent);
    border-radius:1px;
    animation: eq 0.9s ease-in-out infinite;
  }
  .row .eq span:nth-child(1){ height:40%; animation-delay:0s; }
  .row .eq span:nth-child(2){ height:100%; animation-delay:0.2s; }
  .row .eq span:nth-child(3){ height:65%; animation-delay:0.4s; }
  @keyframes eq{ 0%,100%{ transform:scaleY(0.4);} 50%{ transform:scaleY(1);} }

  .spinner{
    width:22px; height:22px;
    border: 2.5px solid var(--sep);
    border-top-color: var(--accent);
    border-radius:50%;
    animation: spin 0.7s linear infinite;
    margin: 30px auto;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  /* ---- Mini player ---- */
  .mini-player{
    position: fixed;
    left:0; right:0;
    bottom: calc(0px + var(--safe-bottom));
    max-width: 560px;
    margin: 0 auto;
    background: rgba(28,28,30,0.65);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border-top: 0.5px solid rgba(255,255,255,0.1);
    display:none;
    align-items:center;
    gap: 10px;
    padding: 8px 10px;
    z-index: 30;
    cursor:pointer;
  }
  .mini-player.show{ display:flex; }
  .mini-player img{
    width: 40px; height:40px; border-radius:7px; object-fit:cover;
    flex-shrink:0;
  }
  .mini-player .mp-info{ flex:1; min-width:0; }
  .mini-player .mp-title{
    font-size: 13.5px; font-weight:600; color: var(--text);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .mini-player .mp-sub{
    font-size: 11.5px; color: var(--text2);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .mini-player .mp-btn{
    width: 34px; height:34px;
    display:flex; align-items:center; justify-content:center;
    background:none; border:none; color: var(--text); flex-shrink:0;
  }
  .mini-progress{
    position:absolute; top:0; left:0; height:2px;
    background: var(--accent);
    width:0%;
  }

  /* ---- Full player sheet ---- */
  .sheet-backdrop{
    position: fixed; inset:0;
    background: rgba(0,0,0,0.5);
    z-index: 40;
    opacity:0; pointer-events:none;
    transition: opacity 0.25s ease;
  }
  .sheet-backdrop.show{ opacity:1; pointer-events:auto; }
  .player-sheet{
    position: fixed;
    left:0; right:0; bottom:0;
    max-width: 560px;
    margin: 0 auto;
    background: rgba(18,16,22,0.72);
    backdrop-filter: blur(34px) saturate(180%);
    -webkit-backdrop-filter: blur(34px) saturate(180%);
    border-top: 0.5px solid rgba(255,255,255,0.1);
    border-radius: 20px 20px 0 0;
    z-index: 41;
    transform: translateY(100%);
    transition: transform 0.32s cubic-bezier(.32,.72,0,1);
    max-height: 92vh;
    display:flex;
    flex-direction:column;
    padding-bottom: var(--safe-bottom);
  }
  .player-sheet.show{ transform: translateY(0); }
  .sheet-handle{
    width:36px; height:5px;
    background: var(--text3);
    border-radius:3px;
    margin: 10px auto 4px;
    opacity:0.6;
  }
  .sheet-top{
    display:flex; justify-content:space-between; align-items:center;
    padding: 4px 18px 0;
  }
  .sheet-top button{
    background:none; border:none; color: var(--text2);
    font-size:13px; padding:8px;
  }
  .video-wrap{
    margin: 14px 20px 0;
    border-radius: 14px;
    overflow: hidden;
    background: #000;
    aspect-ratio: 16/9;
    box-shadow: 0 20px 40px -10px rgba(0,0,0,0.6);
  }
  #ytplayer{ width:100%; height:100%; }
  .np-title{
    font-size: 19px; font-weight:700;
    text-align:center;
    margin: 18px 24px 2px;
    letter-spacing: -0.01em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .np-sub{
    font-size: 14px; color: var(--text2);
    text-align:center;
    margin: 0 24px 18px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .progress-wrap{
    padding: 0 24px;
  }
  #progressBar{
    -webkit-appearance:none; appearance:none;
    width:100%; height:4px;
    border-radius:2px;
    background: var(--sep);
    outline:none;
  }
  #progressBar::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:13px; height:13px;
    border-radius:50%;
    background: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    cursor:pointer;
  }
  .time-row{
    display:flex; justify-content:space-between;
    font-size: 11px; color: var(--text3);
    padding: 2px 24px 0;
    font-variant-numeric: tabular-nums;
  }
  .np-controls{
    display:flex;
    align-items:center;
    justify-content: center;
    gap: 36px;
    padding: 20px 24px 8px;
  }
  .np-btn{
    background:none; border:none; color: var(--text);
  }
  .np-btn.play{
    width:60px; height:60px;
    border-radius:50%;
    background: var(--text);
    color:#000;
    display:flex; align-items:center; justify-content:center;
  }
  .np-btn.side svg{ width:26px; height:26px; }
  .np-queue-title{
    font-size: 12px; font-weight:600; color: var(--text2);
    text-transform:uppercase; letter-spacing:0.04em;
    padding: 18px 24px 6px;
  }
  .np-queue{
    flex:1;
    overflow-y:auto;
    padding-bottom: 20px;
  }

  ::-webkit-scrollbar{ display:none; }
</style>
</head>
<body>

<div id="bgLayer" class="empty"></div>

<div id="app">

  <div class="navbar">
    <div class="navbar-row">
      <button class="bg-btn" id="bgBtn" title="Ganti latar belakang">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      </button>
      <div class="search-wrap">
        <svg class="icon-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" type="search" placeholder="Cari lagu atau artis" autocomplete="off">
        <button class="clear-btn" id="clearBtn">&times;</button>
      </div>
      <input type="file" id="bgFileInput" accept="image/*" style="display:none;">
    </div>
  </div>

  <div class="content" id="content">
    <div class="empty-state" id="emptyState">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      <p>Cari lagu di atas untuk mulai putar musik bareng.</p>
    </div>
    <div id="resultsSection" style="display:none;">
      <div class="section-title">Hasil pencarian</div>
      <div class="list" id="resultsList"></div>
    </div>
    <div id="queueSection" style="display:none;">
      <div class="section-title">Antrian</div>
      <div class="list" id="queueList"></div>
    </div>
  </div>

  <div class="mini-player" id="miniPlayer">
    <div class="mini-progress" id="miniProgress"></div>
    <img id="miniThumb" src="" alt="">
    <div class="mp-info">
      <div class="mp-title" id="miniTitle">—</div>
      <div class="mp-sub" id="miniSub">—</div>
    </div>
    <button class="mp-btn" id="miniPlayBtn"></button>
    <button class="mp-btn" id="miniNextBtn">
      <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
    </button>
  </div>

</div>

<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="player-sheet" id="playerSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-top">
    <span></span>
    <button id="closeSheet">Tutup</button>
  </div>
  <div class="video-wrap"><div id="ytplayer"></div></div>
  <div class="np-title" id="npTitle">—</div>
  <div class="np-sub" id="npSub">—</div>
  <div class="progress-wrap">
    <input type="range" id="progressBar" min="0" max="100" value="0" step="0.1">
  </div>
  <div class="time-row"><span id="curTime">0:00</span><span id="durTime">0:00</span></div>
  <div class="np-controls">
    <button class="np-btn side" id="prevBtn">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
    </button>
    <button class="np-btn play" id="playBtn">
      <svg id="playIcon" width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="np-btn side" id="nextBtn">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
    </button>
  </div>
  <div class="np-queue-title">Antrian berikutnya</div>
  <div class="np-queue" id="npQueueList"></div>
</div>

<script>
/* Pencarian sekarang lewat serverless function /api/search (lihat api/search.js),
   jadi API key aman di server dan tidak pernah ikut ke kode ini. */

const els = {
  bgLayer: document.getElementById('bgLayer'),
  bgBtn: document.getElementById('bgBtn'),
  bgFileInput: document.getElementById('bgFileInput'),
  searchInput: document.getElementById('searchInput'),
  clearBtn: document.getElementById('clearBtn'),
  content: document.getElementById('content'),
  emptyState: document.getElementById('emptyState'),
  resultsSection: document.getElementById('resultsSection'),
  resultsList: document.getElementById('resultsList'),
  queueSection: document.getElementById('queueSection'),
  queueList: document.getElementById('queueList'),
  miniPlayer: document.getElementById('miniPlayer'),
  miniProgress: document.getElementById('miniProgress'),
  miniThumb: document.getElementById('miniThumb'),
  miniTitle: document.getElementById('miniTitle'),
  miniSub: document.getElementById('miniSub'),
  miniPlayBtn: document.getElementById('miniPlayBtn'),
  miniNextBtn: document.getElementById('miniNextBtn'),
  sheetBackdrop: document.getElementById('sheetBackdrop'),
  playerSheet: document.getElementById('playerSheet'),
  closeSheet: document.getElementById('closeSheet'),
  npTitle: document.getElementById('npTitle'),
  npSub: document.getElementById('npSub'),
  progressBar: document.getElementById('progressBar'),
  curTime: document.getElementById('curTime'),
  durTime: document.getElementById('durTime'),
  playBtn: document.getElementById('playBtn'),
  playIcon: document.getElementById('playIcon'),
  prevBtn: document.getElementById('prevBtn'),
  nextBtn: document.getElementById('nextBtn'),
  npQueueList: document.getElementById('npQueueList'),
};

const ICON_PLAY = '<path d="M8 5v14l11-7z"/>';
const ICON_PAUSE = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
const ICON_MINI_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor" width="26" height="26"><path d="M8 5v14l11-7z"/></svg>';
const ICON_MINI_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor" width="26" height="26"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>';

let queue = [];       // {id, title, channel, thumb}
let currentIndex = -1;
let player = null;
let playerReady = false;
let progressTimer = null;
let searchDebounce = null;

function fmtTime(s){
  if(!isFinite(s) || s < 0) return '0:00';
  const m = Math.floor(s/60);
  const sec = Math.floor(s%60).toString().padStart(2,'0');
  return `${m}:${sec}`;
}

/* ---------- Custom background photo ---------- */
function applyBg(dataUrl){
  if(dataUrl){
    els.bgLayer.style.backgroundImage = `url(${dataUrl})`;
    els.bgLayer.classList.remove('empty');
  } else {
    els.bgLayer.style.backgroundImage = '';
    els.bgLayer.classList.add('empty');
  }
}
(function initBg(){
  try{
    const saved = localStorage.getItem('tune_bg');
    if(saved) applyBg(saved);
  }catch(e){}
})();
els.bgBtn.addEventListener('click', () => els.bgFileInput.click());
els.bgFileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const dataUrl = reader.result;
    applyBg(dataUrl);
    try{ localStorage.setItem('tune_bg', dataUrl); }catch(e){
      // storage full — background still applies for this session
    }
  };
  reader.readAsDataURL(file);
});

/* ---------- Search ---------- */
els.searchInput.addEventListener('input', () => {
  const q = els.searchInput.value.trim();
  els.clearBtn.style.display = q ? 'flex' : 'none';
  clearTimeout(searchDebounce);
  if(!q){
    els.resultsSection.style.display = 'none';
    updateEmptyState();
    return;
  }
  searchDebounce = setTimeout(() => doSearch(q), 450);
});
els.clearBtn.addEventListener('click', () => {
  els.searchInput.value = '';
  els.clearBtn.style.display = 'none';
  els.resultsSection.style.display = 'none';
  updateEmptyState();
});

async function doSearch(query){
  els.resultsSection.style.display = 'block';
  els.emptyState.style.display = 'none';
  els.resultsList.innerHTML = '<div class="spinner"></div>';

  try{
    const url = `/api/search?q=${encodeURIComponent(query)}`;
    const res = await fetch(url);
    const data = await res.json();
    if(data.error){
      els.resultsList.innerHTML = `<div style="padding:20px;color:var(--danger);font-size:13px;">Error: ${data.error.message}</div>`;
      return;
    }
    const items = data.items || [];
    if(items.length === 0){
      els.resultsList.innerHTML = `<div style="padding:20px;color:var(--text2);font-size:13px;">Tidak ada hasil untuk "${query}"</div>`;
      return;
    }
    els.resultsList.innerHTML = '';
    items.forEach(item => {
      const track = {
        id: item.id.videoId,
        title: item.snippet.title,
        channel: item.snippet.channelTitle,
        thumb: item.snippet.thumbnails.default.url,
      };
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `
        <img class="thumb" src="${track.thumb}" alt="">
        <div class="info">
          <div class="title">${escapeHtml(track.title)}</div>
          <div class="sub">${escapeHtml(track.channel)}</div>
        </div>
        <button class="rowbtn" title="Tambah ke antrian">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      `;
      row.addEventListener('click', (e) => {
        if(e.target.closest('.rowbtn')){
          addToQueue(track, false);
        } else {
          addToQueue(track, true);
        }
      });
      els.resultsList.appendChild(row);
    });
  } catch(err){
    els.resultsList.innerHTML = `<div style="padding:20px;color:var(--danger);font-size:13px;">Gagal memuat: ${err.message}</div>`;
  }
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

/* ---------- Queue ---------- */
function addToQueue(track, playNow){
  queue.push(track);
  renderQueue();
  if(playNow){
    loadTrack(queue.length - 1, true);
    openSheet();
  }
  updateEmptyState();
}

function removeFromQueue(i){
  if(i === currentIndex){
    stopPlayback();
  } else if(i < currentIndex){
    currentIndex--;
  }
  queue.splice(i, 1);
  renderQueue();
  updateEmptyState();
}

function renderQueue(){
  const hasQueue = queue.length > 0;
  els.queueSection.style.display = hasQueue ? 'block' : 'none';

  [els.queueList, els.npQueueList].forEach(container => {
    container.innerHTML = '';
    queue.forEach((track, i) => {
      const row = document.createElement('div');
      row.className = 'row' + (i === currentIndex ? ' active' : '');
      row.innerHTML = `
        <img class="thumb" src="${track.thumb}" alt="">
        <div class="info">
          <div class="title">${escapeHtml(track.title)}</div>
          <div class="sub">${escapeHtml(track.channel)}</div>
        </div>
        ${i === currentIndex ? '<div class="eq"><span></span><span></span><span></span></div>' : ''}
        <button class="rowbtn" data-i="${i}" title="Hapus">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>
        </button>
      `;
      row.addEventListener('click', (e) => {
        const btn = e.target.closest('.rowbtn');
        if(btn){
          removeFromQueue(parseInt(btn.dataset.i));
        } else {
          loadTrack(i, true);
          openSheet();
        }
      });
      container.appendChild(row);
    });
  });
}

function updateEmptyState(){
  const showEmpty = queue.length === 0 && els.resultsSection.style.display === 'none';
  els.emptyState.style.display = showEmpty ? 'block' : 'none';
}

/* ---------- YouTube IFrame Player ---------- */
const tag = document.createElement('script');
tag.src = "https://www.youtube.com/iframe_api";
document.body.appendChild(tag);

function onYouTubeIframeAPIReady(){
  player = new YT.Player('ytplayer', {
    height: '100%', width: '100%',
    playerVars: { playsinline: 1, controls: 0, rel: 0, modestbranding: 1 },
    events: {
      onReady: () => { playerReady = true; },
      onStateChange: onPlayerStateChange,
    }
  });
}

function onPlayerStateChange(e){
  if(e.data === YT.PlayerState.PLAYING){
    setPlayingUI(true);
    startProgressTimer();
  } else if(e.data === YT.PlayerState.PAUSED){
    setPlayingUI(false);
    stopProgressTimer();
  } else if(e.data === YT.PlayerState.ENDED){
    goNext();
  }
}

function loadTrack(i, autoplay){
  if(i < 0 || i >= queue.length || !playerReady) {
    if(!playerReady){
      // wait a bit for player init then retry once
      setTimeout(() => loadTrack(i, autoplay), 400);
    }
    return;
  }
  currentIndex = i;
  const track = queue[i];
  player.loadVideoById(track.id);
  if(!autoplay) player.pauseVideo();
  updateNowPlayingUI(track);
  renderQueue();
  els.miniPlayer.classList.add('show');
}

function stopPlayback(){
  if(player && playerReady) player.stopVideo();
  currentIndex = -1;
  els.miniPlayer.classList.remove('show');
  closeSheet();
}

function updateNowPlayingUI(track){
  els.npTitle.textContent = track.title;
  els.npSub.textContent = track.channel;
  els.miniTitle.textContent = track.title;
  els.miniSub.textContent = track.channel;
  els.miniThumb.src = track.thumb;

  if('mediaSession' in navigator){
    navigator.mediaSession.metadata = new MediaMetadata({
      title: track.title,
      artist: track.channel,
      artwork: [{ src: track.thumb, sizes: '120x90', type: 'image/jpeg' }]
    });
  }
}

function setPlayingUI(isPlaying){
  els.playIcon.innerHTML = isPlaying ? ICON_PAUSE : ICON_PLAY;
  els.miniPlayBtn.innerHTML = isPlaying ? ICON_MINI_PAUSE : ICON_MINI_PLAY;
  if('mediaSession' in navigator){
    navigator.mediaSession.playbackState = isPlaying ? 'playing' : 'paused';
  }
}

if('mediaSession' in navigator){
  navigator.mediaSession.setActionHandler('play', () => player && player.playVideo());
  navigator.mediaSession.setActionHandler('pause', () => player && player.pauseVideo());
  navigator.mediaSession.setActionHandler('previoustrack', goPrev);
  navigator.mediaSession.setActionHandler('nexttrack', goNext);
}

function startProgressTimer(){
  stopProgressTimer();
  progressTimer = setInterval(() => {
    if(!player || !player.getDuration) return;
    const dur = player.getDuration();
    const cur = player.getCurrentTime();
    if(dur > 0){
      const pct = (cur/dur) * 100;
      els.progressBar.value = pct;
      els.miniProgress.style.width = pct + '%';
      els.curTime.textContent = fmtTime(cur);
      els.durTime.textContent = fmtTime(dur);
    }
  }, 500);
}
function stopProgressTimer(){
  clearInterval(progressTimer);
}

function goNext(){
  if(queue.length === 0) return;
  const i = currentIndex >= queue.length - 1 ? 0 : currentIndex + 1;
  loadTrack(i, true);
}
function goPrev(){
  if(queue.length === 0) return;
  const i = currentIndex <= 0 ? queue.length - 1 : currentIndex - 1;
  loadTrack(i, true);
}

/* ---------- Controls ---------- */
els.playBtn.addEventListener('click', togglePlay);
els.miniPlayBtn.addEventListener('click', (e) => { e.stopPropagation(); togglePlay(); });
els.nextBtn.addEventListener('click', goNext);
els.miniNextBtn.addEventListener('click', (e) => { e.stopPropagation(); goNext(); });
els.prevBtn.addEventListener('click', goPrev);

function togglePlay(){
  if(!player || !playerReady || currentIndex === -1) return;
  const state = player.getPlayerState();
  if(state === YT.PlayerState.PLAYING){ player.pauseVideo(); }
  else{ player.playVideo(); }
}

els.progressBar.addEventListener('input', () => {
  if(!player || !player.getDuration) return;
  const dur = player.getDuration();
  if(dur > 0){
    player.seekTo((els.progressBar.value/100) * dur, true);
  }
});

/* ---------- Sheet ---------- */
function openSheet(){
  els.sheetBackdrop.classList.add('show');
  els.playerSheet.classList.add('show');
}
function closeSheet(){
  els.sheetBackdrop.classList.remove('show');
  els.playerSheet.classList.remove('show');
}
els.miniPlayer.addEventListener('click', (e) => {
  if(e.target.closest('.mp-btn')) return;
  openSheet();
});
els.closeSheet.addEventListener('click', closeSheet);
els.sheetBackdrop.addEventListener('click', closeSheet);
</script>
</body>
